apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: huahuo-monitor-pod-discovery
  namespace: ns-applications
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: huahuo-monitor-pod-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: ns-monitoring
  - kind: ServiceAccount
    name: alloy
    namespace: ns-monitoring
