global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          host: center
  - job_name: node_exporter
    file_sd_configs:
      - files: ["/etc/prometheus-targets/hosts.yml"]
        refresh_interval: 15s
  - job_name: application
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [ns-applications]
        selectors:
          - role: pod
            label: "app.kubernetes.io/name in (huahuo-server,huahuo-agent)"
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_phase, __meta_kubernetes_pod_container_init, __meta_kubernetes_pod_container_port_number]
        regex: "Running;false;9464"
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_name]
        regex: "huahuo-server;(api|api-server|admin|worker|scheduler)|huahuo-agent;agent"
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: role
      - source_labels: [role]
        regex: api
        replacement: api-server
        target_label: role
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: host
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - target_label: project
        replacement: huahuo
      - target_label: env
        replacement: test
  - job_name: nginx
    file_sd_configs:
      - files: ["/etc/prometheus-targets/nginx.yml"]
        refresh_interval: 15s
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["kube-state-metrics:8080"]
  - job_name: monitoring
    static_configs:
      - targets: ["loki:3100"]
        labels:
          env: test
          host: center
          service: loki
      - targets: ["alloy:12345"]
        labels:
          env: test
          host: center
          service: alloy
      - targets: ["rds-slow-logs:9129"]
        labels:
          env: test
          host: center
          service: rds-slow-logs
