apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring
  namespace: ns-monitoring
spec:
  tls:
    - hosts: [grafana.chuda.cc]
      secretName: monitoring-tls
  rules:
    - host: grafana.chuda.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
