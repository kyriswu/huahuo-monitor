apiVersion: v1
kind: ServiceAccount
metadata:
  name: huahuo-monitor-deployer
  namespace: ns-monitoring
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: huahuo-monitor-images
  namespace: ns-monitoring
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: huahuo-monitor-deployer-namespace-check
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["ns-monitoring", "ns-applications"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: huahuo-monitor-deployer-namespace-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: huahuo-monitor-deployer-namespace-check
subjects:
  - kind: ServiceAccount
    name: huahuo-monitor-deployer
    namespace: ns-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: huahuo-monitor-deployer
  namespace: ns-monitoring
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["grafana-admin", "rds-api"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["rds-slow-logs-settings"]
    verbs: ["get"]
  # Kustomize content hashes prevent a fixed resourceNames list for ConfigMaps.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "patch"]
  # Kubernetes RBAC cannot restrict top-level create by resourceNames.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "serviceaccounts", "services"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: ["alloy-data", "grafana-data", "loki-data", "prometheus-data", "rds-slow-logs-data"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["alloy", "kube-state-metrics", "prometheus"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["alloy", "grafana", "kube-state-metrics", "loki", "prometheus", "rds-slow-logs"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["alloy", "grafana", "kube-state-metrics", "loki", "prometheus", "rds-slow-logs"]
    verbs: ["get", "list", "patch", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    resourceNames: ["kube-state-metrics", "loki"]
    verbs: ["patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["huahuo-monitor-events", "huahuo-monitor-workload-state"]
    verbs: ["patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["huahuo-monitor-events", "huahuo-monitor-workload-state"]
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: huahuo-monitor-deployer
  namespace: ns-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: huahuo-monitor-deployer
subjects:
  - kind: ServiceAccount
    name: huahuo-monitor-deployer
    namespace: ns-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: huahuo-monitor-deployer
  namespace: ns-applications
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    resourceNames: ["huahuo-server-ingress"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    resourceNames: ["huahuo-monitor-scrape"]
    verbs: ["patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames:
      - huahuo-monitor-events
      - huahuo-monitor-pod-discovery
      - huahuo-monitor-pod-logs
      - huahuo-monitor-workload-state
    verbs: ["patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames:
      - huahuo-monitor-events
      - huahuo-monitor-pod-discovery
      - huahuo-monitor-pod-logs
      - huahuo-monitor-workload-state
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: huahuo-monitor-deployer
  namespace: ns-applications
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: huahuo-monitor-deployer
subjects:
  - kind: ServiceAccount
    name: huahuo-monitor-deployer
    namespace: ns-monitoring
