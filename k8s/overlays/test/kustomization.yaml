apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - monitoring-base.yaml
  - local-storage.yaml
patches:
  - path: pvc-bindings.yaml
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: acr-credential-secret-aggregation
  - target:
      kind: Deployment
      name: prometheus
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - --config.file=/etc/prometheus-config/prometheus.yml
          - --storage.tsdb.path=/prometheus
          - --storage.tsdb.retention.time=30d
          - --storage.tsdb.retention.size=3GB
  - target:
      kind: Deployment
      name: rds-slow-logs
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RDS_USE_VPC_ENDPOINT
          value: "true"
images:
  - name: prom/prometheus
    newName: huahuoai-docker-hub-registry-vpc.cn-beijing.cr.aliyuncs.com/huahuo/huahuo-monitor
    digest: sha256:2e2c559c3067d1cf55e1ff999ffea09f75e5b8d30cf7c06ac424766370280103
  - name: grafana/grafana
