apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: huahuo-monitor-test-local
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: huahuo-monitor-test-prometheus
spec:
  capacity:
    storage: 4Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: huahuo-monitor-test-local
  claimRef:
    name: prometheus-data
    namespace: ns-monitoring
  local:
    path: /var/lib/container/huahuo-monitor/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - cn-beijing.172.16.71.173
---
