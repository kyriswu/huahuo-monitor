apiVersion: apps/v1
kind: Deployment
metadata:
  name: rds-slow-logs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rds-slow-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rds-slow-logs
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rds-slow-logs
          image: python:3.13.11-alpine3.22
          command: ["python", "/app/collector.py"]
          envFrom:
            - configMapRef:
                name: rds-slow-logs-settings
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOKI_PUSH_URL
              value: http://loki:3100/loki/api/v1/push
            - name: STATE_DIR
              value: /var/lib/rds-slow-logs
          ports:
            - name: http
              containerPort: 9129
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
          startupProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: data
              mountPath: /var/lib/rds-slow-logs
            - name: code
              mountPath: /app
              readOnly: true
            - name: credentials
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rds-slow-logs-data
        - name: code
          configMap:
            name: rds-slow-logs-code
        - name: credentials
          secret:
            secretName: rds-api
---
apiVersion: v1
kind: Service
metadata:
  name: rds-slow-logs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rds-slow-logs
  ports:
    - name: http
      port: 9129
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rds-slow-logs-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
