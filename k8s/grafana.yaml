apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:13.3.1
          env:
            - name: GF_SERVER_DOMAIN
              value: grafana.chuda.cc
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.chuda.cc/
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD__FILE
              value: /run/secrets/grafana-admin/password
            - name: GF_SECURITY_COOKIE_SECURE
              value: "true"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_UNIFIED_ALERTING_ENABLED
              value: "true"
            - name: GF_UNIFIED_ALERTING_EXECUTE_ALERTS
              value: "true"
            - name: GF_PLUGINS_DISABLE_PLUGINS
              value: cloudwatch,elasticsearch,stackdriver,grafana-azure-monitor-datasource,grafana-postgresql-datasource,grafana-pyroscope-datasource,graphite,influxdb,jaeger,mssql,mysql,opentsdb,tempo,grafana-testdata-datasource,zipkin,grafana-advisor-app,grafana-lokiexplore-app,grafana-metricsdrilldown-app,grafana-pyroscope-app,grafana-exploretraces-app
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            - name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE
              value: "false"
            - name: GF_LIVE_MAX_CONNECTIONS
              value: "0"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            - name: GF_DASHBOARDS_MIN_REFRESH_INTERVAL
              value: 1m
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: admin-password
              mountPath: /run/secrets/grafana-admin
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: providers
          configMap:
            name: grafana-providers
        - name: admin-password
          secret:
            secretName: grafana-admin
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: grafana-dashboards-overview
                  items:
                    - key: monitoring-overview.json
                      path: 花火AI/总览/monitoring-overview.json
              - configMap:
                  name: grafana-dashboards-http
                  items:
                    - key: http-errors.json
                      path: 花火AI/HTTP 排查/http-errors.json
                    - key: huahuo-server.json
                      path: 花火AI/HTTP 排查/huahuo-server.json
                    - key: http-request-details.json
                      path: 花火AI/HTTP 排查/http-request-details.json
                    - key: slow-requests.json
                      path: 花火AI/HTTP 排查/slow-requests.json
              - configMap:
                  name: grafana-dashboards-agent
                  items:
                    - key: agent-runtime.json
                      path: 花火AI/Agent/agent-runtime.json
              - configMap:
                  name: grafana-dashboards-server
                  items:
                    - key: database-slow-sql.json
                      path: 花火AI/Server/database-slow-sql.json
                    - key: server-workloads.json
                      path: 花火AI/Server/server-workloads.json
              - configMap:
                  name: grafana-dashboards-platform
                  items:
                    - key: prometheus-health.json
                      path: 平台运维/prometheus-health.json
              - configMap:
                  name: grafana-dashboards-kubernetes
                  items:
                    - key: kubernetes-status.json
                      path: Kubernetes/kubernetes-status.json
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
