# Bootstrap HTTP configuration before a Let's Encrypt certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name grafana.chuda.cc dozzle.chuda.cc;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
