global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          host: center
  - job_name: node_exporter
    file_sd_configs:
      - files: ["/etc/prometheus-targets/hosts.yml"]
        refresh_interval: 15s
  - job_name: application
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/etc/prometheus-targets/apps.yml"]
        refresh_interval: 15s
  - job_name: nginx
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/etc/prometheus-targets/nginx.yml"]
        refresh_interval: 15s
  - job_name: monitoring
    file_sd_configs:
      - files: ["/etc/prometheus-targets/monitoring.yml"]
        refresh_interval: 15s
