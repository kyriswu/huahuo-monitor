auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  wal:
    enabled: true
    dir: /loki/wal
  chunk_idle_period: 30m
  max_chunk_age: 2h

limits_config:
  retention_period: 72h
  reject_old_samples: true
  reject_old_samples_max_age: 72h
  max_query_lookback: 72h
  # Ingestion and query scheduling use this pinned image's upstream defaults.
  max_entries_limit_per_query: 5000
  query_timeout: 30s
  split_queries_by_interval: 1h
  allow_structured_metadata: true

query_range:
  cache_results: false
  results_cache:
    cache:
      embedded_cache:
        enabled: false

chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: false

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 1
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
